[project]
name = "Formation-MLOps-1"
version = "0.1.0"
description = "Travaux pratiques d'industrialisation de la science des données"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "notebook>=7.6.3",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "httpx2>=2.16.0",
    "nbconvert>=7.17.2",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "sphinx>=9.2.0",
    "vulture>=2.16",
]

[tool.ruff]
line-length = 100
target-version = "py315"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    ".eggs",
    "*.egg",
    "build",
    "dist",
    ".pytest_cache",
    ".vscode",
    ".idea",
    "docs/_build",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "ISC",    # flake8-implicit-str-concat
    "PIE",    # flake8-pie
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
]

ignore = [
    "E501",   # Le formateur utilise line-length sans garantir une limite stricte
    "ISC001", # Conflit avec le formatage
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-single-line = false

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["F841"]
