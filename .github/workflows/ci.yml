name: Validation
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v2
      - name: Install dependencies
        run: make install
      - name: Run Safety
        run: uv run safety check
      - name: Run linting
        run: make lint
      - name: Run tests
        run: make test
